# .github/workflows/ci.yml
# ──────────────────────────────────────────────────────────────────────────────
# Continuous Integration — Bike Demand Prediction
#
# Two independent jobs run in parallel:
#   1. python-check  — install deps + import smoke test (< 2 min)
#   2. r-check       — renv restore + library smoke test (< 5 min cached)
#
# Neither job runs notebooks (too slow) or calls the OpenWeather API.
# server.R is intentionally NOT sourced — it calls the weather API at startup.
# ──────────────────────────────────────────────────────────────────────────────

name: CI                                                   # workflow name shown in GitHub Actions tab

on:
  push:
    branches: [ main ]                                     # run on every push to main
  pull_request:
    branches: [ main ]                                     # run on every PR targeting main

jobs:

  # ── Job 1: Python dependency install + import smoke test ─────────────────────
  python-check:
    name: Python — install & import smoke test             # label shown in the Actions UI
    runs-on: ubuntu-latest                                 # GitHub-hosted Ubuntu 24.04 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4                          # clone repo at current ref

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"                          # numpy 2.x requires Python >= 3.10
          cache: "pip"                                    # cache pip downloads across runs

      - name: Install Python dependencies
        run: pip install -r requirements.txt              # install all 9 pinned packages

      - name: Python import smoke test
        run: |
          # verify every package in requirements.txt can be imported
          python - <<'EOF'
          import pandas as pd                             # tabular data library
          import numpy as np                             # numerical arrays
          import sklearn                                  # ML model classes
          import matplotlib                               # plotting backend
          import seaborn                                  # statistical visualisation
          import scipy                                    # scientific computing utilities
          import joblib                                   # model serialisation (pkl files)
          import requests                                 # HTTP client for API calls
          import bs4                                      # HTML parsing (pkg name: beautifulsoup4)
          print("Python smoke test passed.")
          print(f"  pandas     {pd.__version__}")
          print(f"  numpy      {np.__version__}")
          print(f"  sklearn    {sklearn.__version__}")
          EOF

  # ── Job 2: R renv restore + library smoke test ───────────────────────────────
  r-check:
    name: R — renv restore & library smoke test           # label shown in the Actions UI
    runs-on: ubuntu-latest                                 # GitHub-hosted Ubuntu 24.04 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4                          # clone repo at current ref

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq                                   # refresh apt package index
          # R HTTP/SSL/XML stack — required by httr, openssl, xml2
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
          # R text rendering stack — required by systemfonts -> textshaping -> ragg (ggplot2 chain)
          sudo apt-get install -y libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev
          # R image format stack — required by png, tiff, jpeg device packages
          sudo apt-get install -y libpng-dev libtiff-dev libjpeg-dev
          # R spatial/GIS stack — required by sf and units (pulled in by leaflet)
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Set up R 4.4.3
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"                             # pin to match renv.lock R version
          use-public-rspm: true                          # use Posit PPM for pre-built Ubuntu binaries

      - name: Restore renv library (with cache)
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1                               # increment this to bust the cache on next run

      - name: R library smoke test
        shell: bash                                       # explicit bash for heredoc syntax
        run: |
          # verify all key Shiny app packages load from the restored renv library
          Rscript - <<'EOF'
          pkgs <- c("shiny", "shinyjs", "shinythemes",   # Shiny app framework and themes
                    "dplyr", "ggplot2", "tidyr",          # data manipulation and visualisation
                    "leaflet", "randomForest",            # interactive map and ML model
                    "httr", "jsonlite",                   # API calls and JSON parsing
                    "readr", "scales", "lubridate")       # CSV reading, formatting, date handling
          for (p in pkgs) {                               # iterate each required package
            tryCatch(
              library(p, character.only = TRUE),          # attempt to load from renv library
              error = function(e) stop(paste("Failed to load:", p, "\n", e$message))
            )
          }
          cat("R smoke test passed. All packages loaded successfully.\n")
          cat("  shiny        ", as.character(packageVersion("shiny")), "\n")
          cat("  randomForest ", as.character(packageVersion("randomForest")), "\n")
          cat("  leaflet      ", as.character(packageVersion("leaflet")), "\n")
          EOF

      - name: Verify model.csv is readable
        shell: bash                                       # explicit bash for consistent quoting
        run: |
          # assert the IBM Shiny model file is present and non-empty
          Rscript -e "
          df <- read.csv('data/processed/model.csv')      # load IBM linear model coefficients
          stopifnot(nrow(df) > 0)                         # fail fast if file is empty or missing
          cat('model.csv OK:', nrow(df), 'rows,', ncol(df), 'cols\n')
          "
