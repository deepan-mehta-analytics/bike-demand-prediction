# .github/workflows/ci.yml
# ──────────────────────────────────────────────────────────────────────────────
# Continuous Integration — Bike Demand Prediction
#
# Two independent jobs run in parallel:
#   1. python-check  — install deps + import smoke test (< 2 min)
#   2. r-check       — renv restore + library smoke test (< 5 min cached)
#
# Neither job runs notebooks (too slow) or calls the OpenWeather API.
# server.R is intentionally NOT sourced — it calls the weather API at startup.
# ──────────────────────────────────────────────────────────────────────────────

name: CI                                                   # workflow name shown in GitHub Actions tab

on:
  push:
    branches: [ main ]                                     # run on every push to main
  pull_request:
    branches: [ main ]                                     # run on every PR targeting main

# Workflow-level env: single source of truth for the R version pinned to renv.lock.
# Referenced by r-check and testthat in setup-r r-version + the shared renv cache key,
# so bumping R version touches one line instead of six.
env:
  R_VERSION: "4.4.3"                                       # must match renv.lock; used by r-check and testthat
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true                 # force Node.js 24 for all sub-actions (including r-lib internals); pre-empts June 2 cutover

jobs:

  # ── Job 1: Python dependency install + import smoke test ─────────────────────
  python-check:
    name: Python — install & import smoke test             # label shown in the Actions UI
    runs-on: ubuntu-latest                                 # GitHub-hosted Ubuntu 24.04 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6                          # clone repo at current ref

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"                          # numpy 2.x requires Python >= 3.10
          cache: "pip"                                    # cache pip downloads across runs

      - name: Install Python dependencies
        run: pip install -r requirements.txt              # install all 9 pinned packages

      - name: Python import smoke test
        run: |
          # verify every package in requirements.txt can be imported
          python - <<'EOF'
          import pandas as pd                             # tabular data library
          import numpy as np                             # numerical arrays
          import sklearn                                  # ML model classes
          import matplotlib                               # plotting backend
          import seaborn                                  # statistical visualisation
          import scipy                                    # scientific computing utilities
          import joblib                                   # model serialisation (pkl files)
          import requests                                 # HTTP client for API calls
          import bs4                                      # HTML parsing (pkg name: beautifulsoup4)
          print("Python smoke test passed.")
          print(f"  pandas     {pd.__version__}")
          print(f"  numpy      {np.__version__}")
          print(f"  sklearn    {sklearn.__version__}")
          EOF

  # ── Job 2: R renv restore + library smoke test ───────────────────────────────
  r-check:
    name: R — renv restore & library smoke test           # label shown in the Actions UI
    runs-on: ubuntu-latest                                 # GitHub-hosted Ubuntu 24.04 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6                          # clone repo at current ref

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest     # caches .deb files in GHA cache; dpkg-installs on hit (no network)
        with:
          packages: >-
            libcurl4-openssl-dev libssl-dev libxml2-dev
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev
            libpng-dev libtiff-dev libjpeg-dev
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev cmake gdal-bin
            libx11-dev pandoc
          version: 1.0                                   # user-defined cache-bust key; increment to force refresh

      - name: Set up R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}                # workflow-level env; matches renv.lock R version
          use-public-rspm: true                          # use Posit PPM for pre-built Ubuntu binaries

      - name: Cache renv packages
        uses: actions/cache@v5                           # standard GitHub cache action
        with:
          path: ~/.cache/R/renv                          # renv's global package cache directory
          key: ${{ runner.os }}-R-${{ env.R_VERSION }}-renv-3-${{ hashFiles('renv.lock') }}   # invalidate on lockfile change
          restore-keys: ${{ runner.os }}-R-${{ env.R_VERSION }}-renv-3-                        # partial match for cache hit

      - name: Restore renv library
        shell: bash
        run: |
          # setup-r sets RENV_CONFIG_REPOS_OVERRIDE=PPM-only in the shell environment;
          # unset it HERE in bash before Rscript starts — renv reads this env var during
          # source('renv/activate.R'), so clearing it inside R (Sys.unsetenv) is too late
          unset RENV_CONFIG_REPOS_OVERRIDE                                   # clear PPM-only flag before R starts
          Rscript -e "
          source('renv/activate.R')                                         # bootstrap renv from lockfile version
          options(repos = c(                                                 # set dual-repo strategy:
            PPM  = 'https://packagemanager.posit.co/cran/__linux__/noble/latest',  # PPM first — fast Ubuntu binaries
            CRAN = 'https://cloud.r-project.org'                            # CRAN fallback — source for PPM gaps
          ))
          renv::restore()                                                    # restore all 139 packages
          "

      - name: R library smoke test
        shell: bash                                       # explicit bash for heredoc syntax
        run: |
          # verify all key Shiny app packages load from the restored renv library
          Rscript - <<'EOF'
          pkgs <- c("shiny", "shinyjs", "shinythemes",   # Shiny app framework and themes
                    "dplyr", "ggplot2", "tidyr",          # data manipulation and visualisation
                    "leaflet", "randomForest",            # interactive map and ML model
                    "httr", "jsonlite",                   # API calls and JSON parsing
                    "readr", "scales", "lubridate")       # CSV reading, formatting, date handling
          for (p in pkgs) {                               # iterate each required package
            tryCatch(
              library(p, character.only = TRUE),          # attempt to load from renv library
              error = function(e) stop(paste("Failed to load:", p, "\n", e$message))
            )
          }
          cat("R smoke test passed. All packages loaded successfully.\n")
          cat("  shiny        ", as.character(packageVersion("shiny")), "\n")
          cat("  randomForest ", as.character(packageVersion("randomForest")), "\n")
          cat("  leaflet      ", as.character(packageVersion("leaflet")), "\n")
          EOF

      - name: Verify model.csv is readable
        shell: bash                                       # explicit bash for consistent quoting
        run: |
          # assert the IBM Shiny model file is present and non-empty
          Rscript -e "
          df <- read.csv('data/processed/model.csv')      # load IBM linear model coefficients
          stopifnot(nrow(df) > 0)                         # fail fast if file is empty or missing
          cat('model.csv OK:', nrow(df), 'rows,', ncol(df), 'cols\n')
          "

  # ── Job 3: Docker build smoke test ──────────────────────────────────────────
  # Validates that Dockerfile.shiny builds successfully on every push.
  # Uses docker/build-push-action with GitHub Actions cache so the expensive
  # renv::restore() layer (~73 packages) is served from cache on subsequent runs
  # when renv.lock is unchanged.  First run after a cache miss is still slow;
  # subsequent runs drop from ~10–35 min to < 2 min.
  docker-compose-build:
    name: Docker — build Shiny service                   # label shown in the Actions UI
    runs-on: ubuntu-latest                               # GitHub-hosted Ubuntu 24.04 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6                        # clone repo at current ref

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4              # enables BuildKit + GHA cache backend

      - name: Build Shiny Docker image
        uses: docker/build-push-action@v7
        with:
          context: .                                     # build context is repo root (renv.lock, data/, shiny_app/)
          file: Dockerfile.shiny                         # explicit Dockerfile path
          push: false                                    # smoke test only — do not push to any registry
          cache-from: type=gha                           # restore image layers from GitHub Actions cache
          cache-to: type=gha,mode=max                    # write all layers back to GHA cache after build

  # ── Job 4: testthat unit suite ───────────────────────────────────────────────
  # Runs the 62-assertion testthat suite (20 model + 38 gbfs + 4 bigquery).
  # Mirrors the r-check renv restore pattern (unset RENV_CONFIG_REPOS_OVERRIDE,
  # manual options(repos=...)) and shares the same renv cache key so whichever
  # of {r-check, testthat} runs second pulls from a warm cache.
  # Copies data/processed/model.csv to shiny_app/model.csv before running tests
  # because shiny_app/model.csv is gitignored (Dockerfile.shiny copies it at
  # image build time; the CI run does the equivalent copy for the test job).
  testthat:
    name: R — testthat unit suite                         # label shown in the Actions UI
    runs-on: ubuntu-latest                                # GitHub-hosted Ubuntu 24.04 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6                         # clone repo at current ref

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest     # caches .deb files in GHA cache; dpkg-installs on hit
        with:
          packages: >-
            libcurl4-openssl-dev libssl-dev libxml2-dev
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev
            libpng-dev libtiff-dev libjpeg-dev
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev cmake gdal-bin
            libx11-dev pandoc
          version: 1.0                                   # user-defined cache-bust key; matches r-check

      - name: Set up R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}                # workflow-level env; matches renv.lock R version
          use-public-rspm: true                          # use Posit PPM for pre-built Ubuntu binaries

      - name: Cache renv packages
        uses: actions/cache@v5                           # standard GitHub cache action
        with:
          path: ~/.cache/R/renv                          # renv's global package cache directory
          key: ${{ runner.os }}-R-${{ env.R_VERSION }}-renv-3-${{ hashFiles('renv.lock') }}   # same key as r-check — shared cache
          restore-keys: ${{ runner.os }}-R-${{ env.R_VERSION }}-renv-3-                        # partial match for cache hit

      - name: Restore renv library
        shell: bash
        run: |
          # setup-r sets RENV_CONFIG_REPOS_OVERRIDE=PPM-only in the shell environment;
          # unset it here in bash before Rscript starts — renv reads this env var during
          # source('renv/activate.R'), so clearing it inside R (Sys.unsetenv) is too late.
          unset RENV_CONFIG_REPOS_OVERRIDE                                   # clear PPM-only flag before R starts
          Rscript -e "
          source('renv/activate.R')                                         # bootstrap renv from lockfile version
          options(repos = c(                                                 # dual-repo strategy:
            PPM  = 'https://packagemanager.posit.co/cran/__linux__/noble/latest',  # PPM first — fast Ubuntu binaries
            CRAN = 'https://cloud.r-project.org'                            # CRAN fallback — source for PPM gaps
          ))
          renv::restore()                                                    # restore all packages from renv.lock
          "

      - name: Copy model.csv into shiny_app/
        shell: bash
        run: |
          # shiny_app/model.csv is gitignored (Dockerfile.shiny COPYs it at image build time).
          # The testthat suite sources model_prediction.R which reads model.csv via the
          # relative path 'model.csv' from cwd=shiny_app/ — so we materialise it here.
          # Guard surfaces a clear error if the source file is missing/empty so the
          # failure points at the data layer rather than looking like a test bug.
          if [ ! -s data/processed/model.csv ]; then
            echo "::error file=data/processed/model.csv::source file missing or empty — cannot run testthat suite"
            exit 1
          fi
          cp data/processed/model.csv shiny_app/model.csv  # bridge the gitignore for CI
          ls -la shiny_app/model.csv                       # log file size for debugging

      - name: Run testthat suite
        shell: bash
        run: |
          # tests/testthat.R sets cwd to shiny_app/ via rprojroot and runs test_dir().
          # CI=true is auto-set by GitHub Actions → stop_on_failure=FALSE → all failures
          # reported in one run instead of fast-failing on the first.
          Rscript tests/testthat.R                         # full suite: 62 assertions expected
